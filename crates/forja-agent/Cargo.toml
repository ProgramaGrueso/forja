[package]
name = "forja-agent"
version.workspace = true
edition.workspace = true

[dependencies]
forja-core = { path = "../forja-core" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "process", "fs", "io-util"] }
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
