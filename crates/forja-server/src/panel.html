<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forja — Panel de ejecuciones</title>
  <style>
    :root {
      --bg: #0b0f14;
      --surface: #111827;
      --surface-alt: #0f1623;
      --border: #1f2937;
      --border-strong: #374151;
      --text: #e5e7eb;
      --text-muted: #9ca3af;
      --emerald: #10b981;
      --emerald-dim: rgba(16, 185, 129, 0.14);
      --violet: #8b5cf6;
      --violet-dim: rgba(139, 92, 246, 0.16);
      --amber: #f59e0b;
      --amber-dim: rgba(245, 158, 11, 0.16);
      --red: #ef4444;
      --red-dim: rgba(239, 68, 68, 0.16);
      --gray: #9ca3af;
      --gray-dim: rgba(156, 163, 175, 0.14);
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px 20px 48px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 18px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--emerald), var(--violet));
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .refresh-indicator {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--emerald);
      opacity: 0.85;
    }

    .dot.loading {
      background: var(--violet);
    }

    .dot.error {
      background: var(--red);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 20px;
    }

    .card-title {
      margin: 0 0 14px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
    }

    input[type="text"],
    textarea,
    select {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    textarea {
      min-height: 76px;
      resize: vertical;
    }

    input[type="text"]:focus,
    textarea:focus,
    select:focus {
      border-color: var(--violet);
    }

    .form-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
    }

    .feedback {
      font-size: 12px;
      color: var(--text-muted);
      min-height: 18px;
    }

    .feedback.ok {
      color: var(--emerald);
    }

    .feedback.err {
      color: var(--red);
    }

    button {
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      border-radius: 6px;
      padding: 7px 14px;
      border: 1px solid var(--border-strong);
      background: var(--surface-alt);
      color: var(--text);
      transition: background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
    }

    button:hover:not(:disabled) {
      border-color: var(--violet);
      background: #172033;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button.primary {
      background: var(--emerald);
      border-color: var(--emerald);
      color: #062118;
      font-weight: 600;
    }

    button.primary:hover:not(:disabled) {
      background: #34d399;
      border-color: #34d399;
    }

    button.danger {
      background: var(--red-dim);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 4px 10px;
      font-size: 12px;
    }

    button.danger:hover:not(:disabled) {
      background: rgba(239, 68, 68, 0.28);
      border-color: var(--red);
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th,
    td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    th {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      background: var(--surface-alt);
    }

    tbody tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .mono {
      font-family: var(--font-mono);
      font-size: 12px;
    }

    .muted {
      color: var(--text-muted);
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      border: 1px solid transparent;
    }

    .badge-done {
      background: var(--emerald-dim);
      color: var(--emerald);
      border-color: rgba(16, 185, 129, 0.35);
    }

    .badge-running {
      background: var(--violet-dim);
      color: #c4b5fd;
      border-color: rgba(139, 92, 246, 0.4);
    }

    .badge-pending {
      background: var(--amber-dim);
      color: #fcd34d;
      border-color: rgba(245, 158, 11, 0.4);
    }

    .badge-failed {
      background: var(--red-dim);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.4);
    }

    .badge-cancelled {
      background: var(--gray-dim);
      color: var(--gray);
      border-color: rgba(156, 163, 175, 0.35);
    }

    .empty {
      text-align: center;
      padding: 28px 12px;
      color: var(--text-muted);
    }

    @media (max-width: 680px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <h1>Forja — Panel de ejecuciones</h1>
      </div>
      <div class="header-actions">
        <span class="refresh-indicator" id="refresh-status">
          <span class="dot" id="refresh-dot"></span>
          <span id="refresh-text">Sincronizando…</span>
        </span>
        <button type="button" id="refresh-btn">Actualizar</button>
      </div>
    </header>

    <section class="card" aria-label="Nueva tarea">
      <h2 class="card-title">Lanzar nueva tarea</h2>
      <form id="task-form">
        <div class="form-grid">
          <div class="field full">
            <label for="titulo">Título</label>
            <input id="titulo" name="titulo" type="text" required placeholder="Ej. Revisar pruebas de integración">
          </div>
          <div class="field full">
            <label for="prompt">Prompt</label>
            <textarea id="prompt" name="prompt" required placeholder="Describe la tarea a ejecutar…"></textarea>
          </div>
          <div class="field">
            <label for="privacidad">Privacidad</label>
            <select id="privacidad" name="privacidad">
              <option value="open" selected>open</option>
              <option value="sensitive">sensitive</option>
            </select>
          </div>
          <div class="field">
            <label for="agent">Agente</label>
            <select id="agent" name="agent">
              <option value="mock" selected>mock</option>
              <option value="agy">agy</option>
            </select>
          </div>
        </div>
        <div class="form-footer">
          <div class="feedback" id="form-feedback" role="status" aria-live="polite"></div>
          <button type="submit" class="primary" id="submit-btn">Lanzar tarea</button>
        </div>
      </form>
    </section>

    <section class="card" aria-label="Ejecuciones">
      <h2 class="card-title">Ejecuciones</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Título</th>
              <th>Agente</th>
              <th>Privacidad</th>
              <th>Estado</th>
              <th>Rama</th>
              <th>Intentos</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="runs-body">
            <tr>
              <td colspan="8" class="empty">Cargando ejecuciones…</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    (function () {
      const runsBody = document.getElementById("runs-body");
      const refreshBtn = document.getElementById("refresh-btn");
      const refreshDot = document.getElementById("refresh-dot");
      const refreshText = document.getElementById("refresh-text");
      const taskForm = document.getElementById("task-form");
      const formFeedback = document.getElementById("form-feedback");
      const submitBtn = document.getElementById("submit-btn");

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function shortId(id) {
        const s = String(id ?? "");
        return s.length > 8 ? s.slice(0, 8) : s;
      }

      function statusBadge(status) {
        const key = String(status ?? "").toLowerCase();
        const valid = ["done", "running", "pending", "failed", "cancelled"];
        const cls = valid.includes(key) ? "badge-" + key : "badge-cancelled";
        return '<span class="badge ' + cls + '">' + escapeHtml(key || "unknown") + "</span>";
      }

      function canCancel(status) {
        return status === "pending" || status === "running";
      }

      function renderRuns(runs) {
        if (!Array.isArray(runs) || runs.length === 0) {
          runsBody.innerHTML = '<tr><td colspan="8" class="empty">No hay ejecuciones registradas.</td></tr>';
          return;
        }

        const ordered = runs.slice().sort(function (a, b) {
          return (b.created_at_ms || 0) - (a.created_at_ms || 0);
        });

        runsBody.innerHTML = ordered.map(function (run) {
          const id = String(run.id ?? "");
          const titulo = run.task ? run.task.titulo : "";
          const privacidad = run.task ? run.task.privacidad : "";
          const agent = run.agent ?? "";
          const status = String(run.status ?? "");
          const branch = run.branch ? escapeHtml(run.branch) : '<span class="muted">—</span>';
          const attempts = run.attempts ?? 0;
          const actionCell = canCancel(status)
            ? '<button type="button" class="danger" data-cancel-id="' + escapeHtml(id) + '">Cancelar</button>'
            : '<span class="muted">—</span>';

          return (
            "<tr>" +
            '<td class="mono" title="' + escapeHtml(id) + '">' + escapeHtml(shortId(id)) + "</td>" +
            "<td>" + escapeHtml(titulo) + "</td>" +
            '<td class="mono">' + escapeHtml(agent) + "</td>" +
            '<td class="mono">' + escapeHtml(privacidad) + "</td>" +
            "<td>" + statusBadge(status) + "</td>" +
            '<td class="mono">' + branch + "</td>" +
            '<td class="mono">' + escapeHtml(attempts) + "</td>" +
            "<td>" + actionCell + "</td>" +
            "</tr>"
          );
        }).join("");
      }

      async function loadRuns() {
        refreshDot.className = "dot loading";
        try {
          const resp = await fetch("/runs", { headers: { Accept: "application/json" } });
          if (!resp.ok) {
            throw new Error("Error " + resp.status);
          }
          const data = await resp.json();
          renderRuns(data);
          const now = new Date();
          const hh = String(now.getHours()).padStart(2, "0");
          const mm = String(now.getMinutes()).padStart(2, "0");
          const ss = String(now.getSeconds()).padStart(2, "0");
          refreshDot.className = "dot";
          refreshText.textContent = "Actualizado " + hh + ":" + mm + ":" + ss;
        } catch (err) {
          refreshDot.className = "dot error";
          refreshText.textContent = "Error al actualizar";
        }
      }

      async function cancelRun(id, btn) {
        if (btn) {
          btn.disabled = true;
          btn.textContent = "Cancelando…";
        }
        try {
          const resp = await fetch("/runs/" + encodeURIComponent(id) + "/cancel", {
            method: "POST"
          });
          if (!resp.ok) {
            let msg = "Error " + resp.status;
            try {
              const errBody = await resp.json();
              if (errBody && errBody.error) msg = errBody.error;
            } catch (_) {}
            formFeedback.className = "feedback err";
            formFeedback.textContent = "No se pudo cancelar: " + msg;
          }
        } catch (err) {
          formFeedback.className = "feedback err";
          formFeedback.textContent = "Error de red al cancelar.";
        } finally {
          await loadRuns();
        }
      }

      runsBody.addEventListener("click", function (event) {
        const btn = event.target.closest("button[data-cancel-id]");
        if (!btn) return;
        const id = btn.getAttribute("data-cancel-id");
        if (id) cancelRun(id, btn);
      });

      refreshBtn.addEventListener("click", function () {
        loadRuns();
      });

      taskForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        const titulo = document.getElementById("titulo").value.trim();
        const prompt = document.getElementById("prompt").value.trim();
        const privacidad = document.getElementById("privacidad").value;
        const agent = document.getElementById("agent").value;

        if (!titulo || !prompt) {
          formFeedback.className = "feedback err";
          formFeedback.textContent = "Completa título y prompt.";
          return;
        }

        submitBtn.disabled = true;
        formFeedback.className = "feedback";
        formFeedback.textContent = "Enviando tarea…";

        try {
          const resp = await fetch("/tasks", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ titulo, prompt, privacidad, agent })
          });

          if (!resp.ok) {
            let msg = "Error " + resp.status;
            try {
              const errBody = await resp.json();
              if (errBody && errBody.error) msg = errBody.error;
            } catch (_) {}
            formFeedback.className = "feedback err";
            formFeedback.textContent = msg;
          } else {
            const created = await resp.json();
            formFeedback.className = "feedback ok";
            formFeedback.textContent = "Tarea creada (" + shortId(created.id) + ").";
            taskForm.reset();
            await loadRuns();
          }
        } catch (err) {
          formFeedback.className = "feedback err";
          formFeedback.textContent = "Error de red al crear la tarea.";
        } finally {
          submitBtn.disabled = false;
        }
      });

      loadRuns();
      setInterval(loadRuns, 3000);
    })();
  </script>
</body>
</html>
