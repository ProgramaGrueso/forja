[workspace]
resolver = "2"
members = [
    "crates/forja-core",
    "crates/forja-git",
    "crates/forja-agent",
    "crates/forja-store",
    "crates/forja-sched",
    "crates/forja-server",
    "crates/forja-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
